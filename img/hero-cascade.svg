<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Several magnetocaloric compositions with staggered transition temperatures combine into one broad entropy plateau" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cascaded transitions widen the operating range</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1B4965"/>
      <stop offset="30%"  stop-color="#2E7D96"/>
      <stop offset="55%"  stop-color="#7FA98A"/>
      <stop offset="80%"  stop-color="#C98A3C"/>
      <stop offset="100%" stop-color="#A8551F"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1B4965" stop-opacity="0.10"/>
      <stop offset="55%"  stop-color="#7FA98A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#A8551F" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" fill="#FBFCFC"/>

  <!-- Axes -->
  <g stroke="#D5DDE2" stroke-width="1.5">
    <line x1="90" y1="350" x2="845" y2="350"/>
    <line x1="90" y1="50"  x2="90"  y2="350"/>
  </g>
  <g fill="#46606F" font-family="Helvetica, Arial, sans-serif" font-size="15">
    <text x="845" y="378" text-anchor="end">Temperature</text>
    <text x="90" y="38" text-anchor="middle">|&#916;S|</text>
  </g>

  <!-- Combined response: the broad plateau the project is after -->
  <path d="M130 350 C 190 350, 195 150, 255 148 C 330 146, 400 146, 470 146 C 545 146, 620 148, 690 150 C 750 152, 755 350, 815 350 Z"
        fill="url(#fill)"/>
  <path d="M130 350 C 190 350, 195 150, 255 148 C 330 146, 400 146, 470 146 C 545 146, 620 148, 690 150 C 750 152, 755 350, 815 350"
        fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Individual compositions, each peaking at its own transition temperature -->
  <g fill="none" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M130 350 C 175 350, 180 190, 215 190 C 250 190, 255 350, 300 350" stroke="#1B4965"/>
    <path d="M245 350 C 290 350, 295 190, 330 190 C 365 190, 370 350, 415 350" stroke="#2E7D96"/>
    <path d="M360 350 C 405 350, 410 190, 445 190 C 480 190, 485 350, 530 350" stroke="#7FA98A"/>
    <path d="M475 350 C 520 350, 525 190, 560 190 C 595 190, 600 350, 645 350" stroke="#C98A3C"/>
    <path d="M590 350 C 635 350, 640 190, 675 190 C 710 190, 715 350, 760 350" stroke="#A8551F"/>
  </g>

  <!-- The operating span -->
  <g stroke="#46606F" stroke-width="1.5">
    <line x1="215" y1="118" x2="675" y2="118"/>
    <line x1="215" y1="110" x2="215" y2="126"/>
    <line x1="675" y1="110" x2="675" y2="126"/>
  </g>
  <text x="445" y="104" text-anchor="middle" fill="#10222F"
        font-family="Helvetica, Arial, sans-serif" font-size="16">&#916;T span</text>
</svg>
