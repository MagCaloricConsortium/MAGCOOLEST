<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="MAGCOOLEST" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MAGCOOLEST</title>
  <defs>
    <linearGradient id="thermal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#1B4965"/>
      <stop offset="30%"  stop-color="#2E7D96"/>
      <stop offset="55%"  stop-color="#7FA98A"/>
      <stop offset="80%"  stop-color="#C98A3C"/>
      <stop offset="100%" stop-color="#A8551F"/>
    </linearGradient>
  </defs>

  <!-- Graded block: each layer is a composition with its own transition temperature -->
  <rect x="18" y="12" width="40" height="96" fill="url(#thermal)"/>

  <!-- Layer boundaries: the discrete steps of a composition gradient -->
  <g stroke="#FBFCFC" stroke-width="2">
    <line x1="18" y1="36" x2="58" y2="36"/>
    <line x1="18" y1="60" x2="58" y2="60"/>
    <line x1="18" y1="84" x2="58" y2="84"/>
  </g>

  <!-- Cascade: each step's response, offset in temperature, widening the span -->
  <g fill="none" stroke="url(#thermal)" stroke-width="3" stroke-linecap="round">
    <path d="M70 100 C 76 100, 78 82, 84 82 C 90 82, 92 100, 98 100"/>
    <path d="M70 76  C 78 76,  80 56, 86 56  C 92 56,  94 76, 102 76"/>
    <path d="M70 52  C 80 52,  82 30, 88 30  C 94 30,  96 52, 106 52"/>
  </g>
</svg>
